name: voicechat_interaction
version: '$version'
main: dev.igalaxy.voicechatinteraction.VoiceChatInteraction
api-version: '26.2'
prefix: voicechat_interaction
authors: [ "henkelmax", "iGalaxy" ]
description: $description
website: https://github.com/DeuX24/voicechat-interaction-paper
depend: [ voicechat ]
commands:
  voicechat_interaction:
    description: "Manage Voice Chat Interaction settings"
    usage: "/voicechat_interaction toggle [<player>]"
    permission: voicechat_interaction
permissions:
  voicechat_interaction:
    description: Use /voicechat_interaction.
    default: true
  voicechat_interaction.toggle:
    description: Toggle voice chat interaction for yourself.
    default: true
  voicechat_interaction.toggle.others:
    description: Toggle voice chat interaction for other players.
    default: op
